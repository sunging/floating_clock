name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows-first app: run on Windows so the win32-only tests (screen.py,
    # winsound) actually execute rather than being skipped.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    env:
      # Headless Qt: create the QApplication and widgets without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest
